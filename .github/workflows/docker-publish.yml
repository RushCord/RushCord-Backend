name: Publish Docker Image

on:
  push:
    branches:
      - main
      # Thêm branch khác nếu muốn:
      # - develop

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/rushcord-backend:latest
          
          # Nếu bạn muốn versioning theo kiểu tự động sinh SHA commit:
          # tags: |
          #   ${{ secrets.DOCKERHUB_USERNAME }}/rushcord-backend:latest
          #   ${{ secrets.DOCKERHUB_USERNAME }}/rushcord-backend:${{ github.sha }}
